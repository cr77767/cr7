<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>洪玟莉 · 早点休息 🌙</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { height: 100%; }
  body {
    height: 100%;
    min-height: 100vh;
    min-height: 100dvh;
    overflow: hidden;
    position: relative;
    background: radial-gradient(120% 120% at 50% 0%, #2b1a4a 0%, #17102e 40%, #0c081c 100%);
    font-family: "PingFang SC", "Microsoft YaHei", "STKaiti", "KaiTi", serif;
  }

  /* ---------- 星云（缓慢漂移的彩色光晕） ---------- */
  .nebula {
    position: fixed;
    border-radius: 50%;
    filter: blur(60px);
    opacity: 0.55;
    pointer-events: none;
    z-index: 0;
    animation: drift 26s ease-in-out infinite alternate;
  }
  .nebula.n1 { width: 55vw; height: 55vw; top: -15%; left: -10%;
    background: radial-gradient(circle, rgba(255,150,205,0.35), transparent 70%); }
  .nebula.n2 { width: 50vw; height: 50vw; bottom: -20%; right: -10%;
    background: radial-gradient(circle, rgba(150,120,255,0.32), transparent 70%);
    animation-delay: -8s; }
  .nebula.n3 { width: 40vw; height: 40vw; top: 40%; left: 30%;
    background: radial-gradient(circle, rgba(255,205,140,0.22), transparent 70%);
    animation-delay: -16s; }
  @keyframes drift {
    from { transform: translate(0, 0) scale(1); }
    to   { transform: translate(6vw, 5vh) scale(1.15); }
  }

  /* ---------- 星星 ---------- */
  .stars { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
  .star {
    position: absolute;
    background: #fff;
    border-radius: 50%;
    animation: twinkle ease-in-out infinite;
  }
  .star.gold { background: #ffe9a0; }
  @keyframes twinkle {
    0%, 100% { opacity: 0.1; transform: scale(0.7); }
    50%      { opacity: 1;   transform: scale(1.4); }
  }

  /* ---------- 流星 ---------- */
  .shooting {
    position: absolute;
    width: 130px; height: 2px;
    border-radius: 50%;
    background: linear-gradient(90deg, rgba(255,255,255,0.95), rgba(255,230,170,0.4), transparent);
    filter: drop-shadow(0 0 6px rgba(255,255,255,0.8));
    opacity: 0;
    animation: shoot linear infinite;
  }
  @keyframes shoot {
    0%   { transform: translate(0, 0) rotate(-30deg); opacity: 0; }
    4%   { opacity: 1; }
    12%  { transform: translate(-55vw, 34vh) rotate(-30deg); opacity: 0; }
    100% { transform: translate(-55vw, 34vh) rotate(-30deg); opacity: 0; }
  }

  /* ---------- 萤火虫（发光小点游走） ---------- */
  .firefly {
    position: absolute;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: radial-gradient(circle, #fffbe0, #ffd76e 55%, transparent);
    box-shadow: 0 0 10px 4px rgba(255, 215, 130, 0.55);
    animation: firefly linear infinite;
    will-change: transform, opacity;
  }
  @keyframes firefly {
    0%   { transform: translate(0, 0); opacity: 0; }
    12%  { opacity: 1; }
    25%  { transform: translate(var(--dx1), var(--dy1)); }
    50%  { transform: translate(var(--dx2), var(--dy2)); }
    75%  { transform: translate(var(--dx3), var(--dy3)); }
    88%  { opacity: 1; }
    100% { transform: translate(var(--dx4), var(--dy4)); opacity: 0; }
  }

  /* ---------- 飘落的花瓣 ---------- */
  .petal {
    position: absolute;
    top: -60px;
    animation: fall linear forwards;
    will-change: transform, opacity;
  }
  @keyframes fall {
    0%   { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0; }
    8%   { opacity: 0.9; }
    25%  { transform: translateY(26vh) translateX(34px) rotate(95deg); }
    50%  { transform: translateY(52vh) translateX(-32px) rotate(190deg); }
    75%  { transform: translateY(78vh) translateX(30px) rotate(285deg); }
    100% { transform: translateY(112vh) translateX(-22px) rotate(380deg); opacity: 0.45; }
  }

  /* ---------- 升起的发光爱心 & 文字 ---------- */
  .float-item {
    position: absolute;
    bottom: -80px;
    animation: floatUp linear forwards;
    will-change: transform, opacity;
  }
  .float-item.heart {
    filter: drop-shadow(0 0 10px rgba(255, 110, 160, 0.7));
  }
  .float-item.word {
    font-weight: 700;
    letter-spacing: 3px;
    color: #ffd9ec;
    text-shadow: 0 0 12px rgba(255, 160, 200, 0.85), 0 0 32px rgba(255, 140, 190, 0.5);
    white-space: nowrap;
  }
  @keyframes floatUp {
    0%   { transform: translateY(0) translateX(0) rotate(-6deg) scale(0.6); opacity: 0; }
    10%  { opacity: 0.95; }
    50%  { transform: translateY(-52vh) translateX(36px) rotate(8deg) scale(1); }
    88%  { opacity: 0.9; }
    100% { transform: translateY(-115vh) translateX(-26px) rotate(-6deg) scale(1.12); opacity: 0; }
  }

  /* ---------- 月亮 ---------- */
  .moon {
    position: fixed;
    top: 7%;
    right: 9%;
    width: 96px; height: 96px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fffdf2, #f9ecc0 58%, #e8cf8a);
    box-shadow: 0 0 40px 12px rgba(255, 240, 180, 0.4), 0 0 90px 30px rgba(255, 230, 170, 0.18);
    z-index: 2;
    pointer-events: none;
  }
  .moon::after {
    content: "";
    position: absolute;
    top: 20px; left: 24px;
    width: 24px; height: 24px;
    border-radius: 50%;
    background: rgba(200, 180, 120, 0.25);
  }

  /* ---------- 中央祝福 ---------- */
  .center {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 5;
    pointer-events: none;
    text-align: center;
    padding: 0 24px;
  }
  .name {
    font-family: "STKaiti", "KaiTi", "楷体", serif;
    font-weight: 700;
    font-size: clamp(52px, 13vw, 118px);
    letter-spacing: 0.08em;
    color: #fff7e6;
    text-shadow:
      0 0 12px rgba(255, 235, 190, 0.85),
      0 0 36px rgba(255, 190, 210, 0.7),
      0 0 70px rgba(255, 150, 200, 0.5);
  }
  .name span {
    display: inline-block;
    opacity: 0;
    animation: riseIn 1.1s cubic-bezier(0.2, 0.7, 0.2, 1) forwards;
  }
  @keyframes riseIn {
    0%   { opacity: 0; transform: translateY(34px) scale(0.9); filter: blur(6px); }
    100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
  }
  .line {
    margin-top: 20px;
    font-size: clamp(20px, 4.5vw, 34px);
    letter-spacing: 0.35em;
    color: #ffd9ec;
    text-shadow: 0 0 16px rgba(255, 150, 200, 0.9);
    opacity: 0;
    animation: riseIn 1.1s ease 0.9s forwards;
  }
  .sub {
    margin-top: 16px;
    font-size: clamp(15px, 3vw, 22px);
    letter-spacing: 0.18em;
    color: rgba(255, 235, 250, 0.85);
    text-shadow: 0 0 10px rgba(255, 190, 220, 0.6);
    opacity: 0;
    animation: riseIn 1.1s ease 1.4s forwards;
  }
  .big-heart {
    margin-top: 26px;
    font-size: clamp(34px, 7vw, 52px);
    animation: heartbeat 1.6s ease-in-out 1.8s infinite;
    opacity: 0;
    filter: drop-shadow(0 0 14px rgba(255, 100, 150, 0.85));
  }
  @keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    14% { transform: scale(1.18); }
    28% { transform: scale(1); }
    42% { transform: scale(1.12); }
    56% { transform: scale(1); }
  }
</style>
</head>
<body>

  <div class="nebula n1"></div>
  <div class="nebula n2"></div>
  <div class="nebula n3"></div>

  <div class="stars" id="stars"></div>
  <div class="moon"></div>

  <div class="center">
    <div class="name" id="name"></div>
    <div class="line">早点休息 🌙</div>
    <div class="sub">愿你把疲惫交给星光 · 把好梦留给自己</div>
    <div class="big-heart" id="bigHeart">💗</div>
  </div>

<script>
  // ---------- 星星 ----------
  const starsBox = document.getElementById('stars');
  for (let i = 0; i < 130; i++) {
    const s = document.createElement('div');
    s.className = 'star' + (Math.random() < 0.35 ? ' gold' : '');
    const size = Math.random() * 3 + 1;
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 100 + '%';
    s.style.animationDuration = (Math.random() * 3 + 2) + 's';
    s.style.animationDelay = (Math.random() * 4) + 's';
    starsBox.appendChild(s);
  }

  // ---------- 名字逐字浮现 ----------
  const name = '洪玟莉';
  const nameBox = document.getElementById('name');
  [...name].forEach((ch, i) => {
    const span = document.createElement('span');
    span.textContent = ch;
    span.style.animationDelay = (0.15 + i * 0.18) + 's';
    nameBox.appendChild(span);
  });

  // 让大爱心先隐藏，动画开始后才显示
  const heart = document.getElementById('bigHeart');
  heart.style.animation = 'heartbeat 1.6s ease-in-out 1.8s infinite';
  requestAnimationFrame(() => requestAnimationFrame(() => { heart.style.opacity = 1; }));

  // ---------- 萤火虫 ----------
  for (let i = 0; i < 26; i++) {
    const f = document.createElement('div');
    f.className = 'firefly';
    f.style.left = (Math.random() * 96 + 2) + '%';
    f.style.top = (Math.random() * 80 + 10) + '%';
    for (let k = 1; k <= 4; k++) {
      f.style.setProperty('--dx' + k, (Math.random() * 160 - 80) + 'px');
      f.style.setProperty('--dy' + k, (Math.random() * 120 - 60) + 'px');
    }
    const dur = Math.random() * 6 + 6;
    f.style.animationDuration = dur + 's';
    f.style.animationDelay = (Math.random() * 6) + 's';
    document.body.appendChild(f);
  }

  // ---------- 流星 ----------
  for (let i = 0; i < 3; i++) {
    const m = document.createElement('div');
    m.className = 'shooting';
    m.style.top = (Math.random() * 35 + 5) + '%';
    m.style.left = (Math.random() * 55 + 30) + '%';
    m.style.animationDuration = (Math.random() * 5 + 7) + 's';
    m.style.animationDelay = (Math.random() * 6 + 2) + 's';
    document.body.appendChild(m);
  }

  // ---------- 花瓣 + 爱心 + 文字 持续生成 ----------
  const PETALS = ['🌸', '🌷', '💮', '🌹', '🌺'];
  const HEARTS = ['💗', '💖', '💕', '💞', '💓', '✨', '⭐', '🌟'];
  const WORDS  = ['洪玟莉', '早点休息', '晚安', '好梦', '辛苦啦', '好好睡觉', '愿你好眠'];

  function spawnPetal() {
    const p = document.createElement('div');
    p.className = 'petal';
    p.textContent = PETALS[Math.floor(Math.random() * PETALS.length)];
    p.style.left = Math.random() * 98 + '%';
    p.style.fontSize = (Math.random() * 18 + 18) + 'px';
    const dur = Math.random() * 7 + 9;
    p.style.animationDuration = dur + 's';
    document.body.appendChild(p);
    setTimeout(() => p.remove(), (dur + 0.2) * 1000);
  }

  function spawnFloat() {
    const item = document.createElement('div');
    if (Math.random() < 0.72) {
      item.className = 'float-item heart';
      item.textContent = HEARTS[Math.floor(Math.random() * HEARTS.length)];
      item.style.fontSize = (Math.random() * 26 + 22) + 'px';
    } else {
      item.className = 'float-item word';
      item.textContent = WORDS[Math.floor(Math.random() * WORDS.length)];
      item.style.fontSize = (Math.random() * 8 + 24) + 'px';
    }
    item.style.left = Math.random() * 96 + '%';
    const dur = Math.random() * 6 + 7;
    item.style.animationDuration = dur + 's';
    document.body.appendChild(item);
    setTimeout(() => item.remove(), (dur + 0.2) * 1000);
  }

  // 开场先铺一波氛围
  for (let i = 0; i < 8; i++) setTimeout(spawnPetal, i * 300);
  for (let i = 0; i < 10; i++) setTimeout(spawnFloat, i * 250);

  setInterval(() => { if (Math.random() < 0.6) spawnPetal(); }, 900);
  setInterval(() => { if (Math.random() < 0.7) spawnFloat(); }, 500);
</script>
</body>
</html>
